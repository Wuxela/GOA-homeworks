<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 style="color: blue;">Hello World</h1>
    <p style="font-size: 20px;">This is a paragraph.</p>
    <div style="background-color: lightgray; padding: 10px;">
        This is a div element with a background color and padding.
    </div>
    <span style="font-weight: bold;">This is a bold text.</span>
    <ul style="list-style-type: square;">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <a href="#" style="text-decoration: none; color: red;">This is a link without underline.</a>
</body>

</html>
