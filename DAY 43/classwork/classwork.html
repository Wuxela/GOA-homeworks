<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <title>ტოპ ფეხბურთელები</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        /* ცხრილი */
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            /* border-ების გაერთიანება */
            border: 3px solid black;
            /* გარე border */
        }

        /* ყველა უჯრა */
        th,
        td {
            border: 2px solid black;
            /* შიდა border */
            padding: 10px;
            text-align: center;
        }

        /* სათაურის სტილი */
        th {
            background-color: #1e3a8a;
            color: white;
        }

        /* კენტი რიგები */
        tr:nth-child(odd) {
            background-color: #93c5fd;
        }

        /* ლუწი რიგები */
        tr:nth-child(even) {
            background-color: #dbeafe;
        }
    </style>

</head>

<body>

    <h1>⚽ ტოპ ფეხბურთელები</h1>

    <table>

        <tr>
            <th>#</th>
            <th>სახელი</th>
            <th>ქვეყანა</th>
            <th>გოლი</th>
            <th>კლუბი</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Lionel Messi</td>
            <td>Argentina</td>
            <td>820</td>
            <td>Inter Miami</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Cristiano Ronaldo</td>
            <td>Portugal</td>
            <td>850</td>
            <td>Al Nassr</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Kylian Mbappe</td>
            <td>France</td>
            <td>300</td>
            <td>Real Madrid</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Erling Haaland</td>
            <td>Norway</td>
            <td>250</td>
            <td>Manchester City</td>
        </tr>

        <tr>
            <td>5</td>
            <td>Neymar Jr</td>
            <td>Brazil</td>
            <td>400</td>
            <td>Al Hilal</td>
        </tr>

        <tr>
            <td>6</td>
            <td>Kevin De Bruyne</td>
            <td>Belgium</td>
            <td>180</td>
            <td>Manchester City</td>
        </tr>

    </table>

</body>

</html>
