<!DOCTYPE html>
<html>

<head>
    <title>Indian States Table</title>

    <style>
        body {
            background: #eeeeee;
            font-family: Georgia, serif;
        }

        .container {
            width: 700px;
            margin: 60px auto;
            border: 4px solid #d9d9d9;
            padding: 20px;
            background: white;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-spacing: 10px;
        }

        th {
            background: #f3f3f3;
            padding: 15px;
            border: 5px solid #777;
        }

        td {
            background: linear-gradient(#1f2b36, #243746);
            color: white;
            padding: 15px;
            border: 5px solid #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Table of Indian States and its Capitals</h2>

        <table>

            <tr>
                <th>Sl no.</th>
                <th>State</th>
                <th>Capital</th>
                <th>Visited the State?</th>
            </tr>

            <tr>
                <td>1</td>
                <td>West Bengal</td>
                <td>Kolkata</td>
                <td>Yes</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Madhya Pradesh</td>
                <td>Bhopal</td>
                <td></td>
            </tr>

            <tr>
                <td>3</td>
                <td>Karnataka</td>
                <td>Bengaluru</td>
                <td></td>
            </tr>

        </table>

    </div>

</body>

</html>
