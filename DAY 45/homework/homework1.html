<!DOCTYPE html>
<html>

<head>
    <title>Information Table</title>

    <style>
        body {
            background: #e6e6e6;
            font-family: serif;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: #d6bf7a;
        }

        th,
        td {
            border: 2px solid #5a4b1a;
            padding: 20px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1>Information</h1>

    <table>
        <tr>
            <th>FirstName</th>
            <th>LastName</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Shreya</td>
            <td>Mishra</td>
            <td>24</td>
        </tr>

        <tr>
            <td>Jai</td>
            <td>Singh</td>
            <td>32</td>
        </tr>

        <tr>
            <td>Philip</td>
            <td>Watson</td>
            <td>41</td>
        </tr>

    </table>

</body>

</html>
